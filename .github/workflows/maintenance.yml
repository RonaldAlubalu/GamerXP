# Every Monday night: database backup, system updates, fresh containers and a
# report. Run it by hand from the Actions tab with "Run workflow".
# Uses the same secrets as the deploy (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY).
# The copy to a second server is made by the server itself (deploy/backup-peer.sh).
name: Weekly maintenance

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Back up, update and report
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_HOST and DEPLOY_SSH_KEY are not set; nothing to do."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          OPTIONS="-o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20"
          SSH="ssh -i $HOME/.ssh/deploy $OPTIONS"
          TARGET="${DEPLOY_USER:-root}@$DEPLOY_HOST"
          AS_ROOT='if [ "$(id -u)" = 0 ]; then sh -s; else sudo -n sh -s; fi'
          mkdir -p report

          status=0
          $SSH "$TARGET" "$AS_ROOT" > report/output.txt 2> report/errors.txt <<'REMOTE' || status=$?
          git -C /opt/gamerxp pull --ff-only >/dev/null 2>&1
          sh /opt/gamerxp/deploy/maintenance.sh
          REMOTE
          grep -v '^LATEST_BACKUP=' report/output.txt > report/report.md || true
          cat report/report.md >> "$GITHUB_STEP_SUMMARY"
          rm report/output.txt
          if [ "$status" -ne 0 ]; then
            echo "::error::Weekly maintenance reported a problem: $(grep -m 1 'PROBLEM' report/report.md || tail -n 1 report/errors.txt)"
          fi

          exit "$status"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-report
          path: report/report.md
          retention-days: 90
          if-no-files-found: ignore
