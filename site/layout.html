<!doctype html>
<html lang="{{lang}}">
<head>

  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:site_name" content="Gamer Xperience">

  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{image}}">

  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="preload" href="/assets/fonts/inter-tight-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>

</head>
<body>
  <a class="skip-link" href="#main">Doorgaan naar inhoud</a>

</html>
